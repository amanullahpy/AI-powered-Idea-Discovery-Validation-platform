    <path d="M38 33L31.5 24C30.8 23 29.5 24.1 29.7 25.4L31 33H38Z" fill="url(#logoRingGrad)" fill-opacity="0.85"/>
    <path d="M28 12C28.5 16 31.5 18 31.5 21.5C31.5 25 29 28.5 28 30C27 28.5 24.5 25 24.5 21.5C24.5 18 27.5 16 28 12Z" fill="url(#logoFlameGrad)" filter="url(#logoGlow)"/>
    <path d="M28 10L29.2 14.5L33.5 15.7L29.2 16.9L28 21.5L26.8 16.9L22.5 15.7L26.8 14.5Z" fill="#ffffff" filter="url(#logoGlow)"/>
